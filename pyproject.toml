[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "qmcursor"
version = "0.2.0"
description = "A Windows cursor theme switcher built with PySide6"
readme = {text = "QMcursor — Windows cursor theme switcher.", content-type = "text/plain"}
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]
build = [
    "pyinstaller>=6,<7",
]

[project.scripts]
qmcursor = "qmcursor.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
qmcursor = [
    "themes/*/*.ani",
    "themes/*/*/*.ani",
    "themes/*/*.cur",
    "themes/*/*.png",
    "themes/*/*.json",
    "resources/*",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
